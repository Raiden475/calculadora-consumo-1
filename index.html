<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiRuta - Bitácora de Viaje</title>

    <!-- Google Fonts: DM Serif Display + DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        leaf:    '#2d6a4f',
                        leafLight: '#52b788',
                        leafPale:  '#d8f3dc',
                        bark:    '#a07850',
                        sand:    '#f5f0e8',
                        stone:   '#e8e2d9',
                    },
                    fontFamily: {
                        serif: ['"DM Serif Display"', 'serif'],
                        sans:  ['"DM Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-sand font-sans text-gray-700 min-h-screen flex items-start justify-center py-12 px-4">

    <div class="w-full max-w-xl">

        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center gap-2 mb-3">
                <span class="text-3xl">🌿</span>
                <h1 class="font-serif text-4xl text-leaf">LogiRuta</h1>
            </div>
            <p class="text-sm text-gray-400 tracking-widest uppercase">Bitácora de Consumo de Combustible</p>
        </header>

        <!-- Tarjeta principal -->
        <div class="bg-white rounded-3xl shadow-sm border border-stone p-8 mb-6">

            <h2 class="font-serif text-xl text-gray-600 mb-6">Registrar Carga</h2>

            <div class="flex flex-col gap-5">

                <!-- Kilometraje -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-widest text-leafLight mb-2">
                        Kilometraje Actual (km)
                    </label>
                    <input
                        type="number"
                        id="input-km"
                        placeholder="Ej: 45320"
                        class="w-full border border-stone rounded-xl px-4 py-3 text-gray-800 bg-sand placeholder:text-gray-300 focus:outline-none focus:border-leafLight focus:ring-2 focus:ring-leafPale transition"
                    >
                </div>

                <!-- Litros -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-widest text-leafLight mb-2">
                        Litros Cargados (L)
                    </label>
                    <input
                        type="number"
                        id="input-litros"
                        placeholder="Ej: 45.00"
                        step="0.01"
                        class="w-full border border-stone rounded-xl px-4 py-3 text-gray-800 bg-sand placeholder:text-gray-300 focus:outline-none focus:border-leafLight focus:ring-2 focus:ring-leafPale transition"
                    >
                </div>

                <!-- Mensaje de error -->
                <p id="msg-error" class="hidden text-sm text-red-400 bg-red-50 border border-red-100 rounded-xl px-4 py-2"></p>

                <!-- Botón Agregar -->
                <button
                    id="btn-agregar"
                    class="w-full bg-leaf text-white font-semibold tracking-wide rounded-xl py-3 hover:bg-leafLight transition active:scale-[0.98]"
                >
                    + Agregar Carga
                </button>
            </div>
        </div>

        <!-- Lista de cargas registradas -->
        <div id="seccion-cargas" class="hidden mb-6">
            <h2 class="font-serif text-xl text-gray-600 mb-4 pl-1">Cargas Registradas</h2>

            <div class="bg-white rounded-3xl border border-stone shadow-sm overflow-hidden">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-leafPale text-leaf text-xs uppercase tracking-wider">
                            <th class="py-3 px-5 text-left font-semibold">#</th>
                            <th class="py-3 px-5 text-left font-semibold">Kilometraje</th>
                            <th class="py-3 px-5 text-left font-semibold">Litros</th>
                            <th class="py-3 px-5 text-left font-semibold">Parcial</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cargas">
                        <!-- Las filas se generan dinámicamente desde script.js -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Botón Finalizar Viaje -->
        <div id="seccion-finalizar" class="hidden mb-6">
            <button
                id="btn-finalizar"
                class="w-full bg-bark text-white font-semibold tracking-wide rounded-xl py-4 hover:opacity-90 transition active:scale-[0.98] shadow-sm"
            >
                🏁 Finalizar Viaje y Calcular
            </button>
        </div>

        <!-- Resultado final -->
        <div id="resultado-final" class="hidden">
            <div class="bg-leaf text-white rounded-3xl p-8 text-center shadow-md">
                <p class="text-leafPale text-xs uppercase tracking-widest mb-4">Resumen del Viaje</p>
                <div class="grid grid-cols-3 gap-6 mb-6">
                    <div>
                        <p class="text-leafPale text-xs mb-1">Distancia</p>
                        <p id="res-distancia" class="text-2xl font-serif">—</p>
                        <p class="text-leafPale text-xs">km</p>
                    </div>
                    <div>
                        <p class="text-leafPale text-xs mb-1">Total Cargado</p>
                        <p id="res-litros" class="text-2xl font-serif">—</p>
                        <p class="text-leafPale text-xs">litros</p>
                    </div>
                    <div>
                        <p class="text-leafPale text-xs mb-1">Consumo</p>
                        <p id="res-consumo" class="text-2xl font-serif">—</p>
                        <p class="text-leafPale text-xs">L/100km</p>
                    </div>
                </div>
                <button
                    id="btn-nuevo-viaje"
                    class="bg-white text-leaf font-semibold px-6 py-2 rounded-full text-sm hover:bg-leafPale transition"
                >
                    Nuevo Viaje
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-xs text-gray-300 mt-10">LogiRuta © 2025 · Herramienta para choferes</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
